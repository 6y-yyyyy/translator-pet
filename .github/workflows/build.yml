name: Windows build and UI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop app
        shell: powershell
        run: ./tools/build.ps1
      - name: Check window interactions
        shell: powershell
        run: ./tools/test.ps1
      - name: Check text processing
        run: python -m unittest discover -s tests -p "test_*.py" -v
